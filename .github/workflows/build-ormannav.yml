          package com.ormannav.app.security

          import android.annotation.SuppressLint
          import android.content.Context
          import android.provider.Settings
          import android.util.Base64
          import java.security.MessageDigest
          import java.util.Locale

          object SecurityManager {
              private const val VAULT_NAME = "ogm_sec_vault_v4"
              private val SALT_1_OBF = intArrayOf(70, 78, 68, 86, 59, 57, 59, 63, 86, 66, 72, 74, 86, 70, 65, 76, 75, 86, 56, 58)
              private val SALT_2_OBF = intArrayOf(68, 76, 70, 84, 71, 66, 72, 78, 69, 72, 84, 57, 59, 57, 61, 84, 83, 68, 69)
              private const val ADMIN_PASS_HASH = "__ADMIN_PASS_HASH__"
              private val ADMIN_EMAIL_OBF = intArrayOf(__ADMIN_EMAIL_OBF__)

              private fun getSalt1(): String = String(CharArray(SALT_1_OBF.size) { i -> (SALT_1_OBF[i] xor 9).toChar() })
              private fun getSalt2(): String = String(CharArray(SALT_2_OBF.size) { i -> (SALT_2_OBF[i] xor 11).toChar() })
              fun getAdminEmail(): String = String(CharArray(ADMIN_EMAIL_OBF.size) { i -> (ADMIN_EMAIL_OBF[i] xor 13).toChar() })

              private fun sha256Hex(input: String): String {
                  val digest = MessageDigest.getInstance("SHA-256").digest(input.toByteArray(Charsets.UTF_8))
                  return digest.joinToString("") { "%02X".format(it) }
              }

              private fun xorEncryptBase64(plain: String, key: String): String {
                  val p = plain.toByteArray(Charsets.UTF_8); val k = key.toByteArray(Charsets.UTF_8)
                  val out = ByteArray(p.size) { i -> (p[i].toInt() xor k[i % k.size].toInt()).toByte() }
                  return Base64.encodeToString(out, Base64.NO_WRAP)
              }

              private fun xorDecryptBase64(encoded: String, key: String): String = try {
                  val d = Base64.decode(encoded, Base64.NO_WRAP); val k = key.toByteArray(Charsets.UTF_8)
                  String(ByteArray(d.size) { i -> (d[i].toInt() xor k[i % k.size].toInt()).toByte() }, Charsets.UTF_8)
              } catch (_: Exception) { "" }

              @SuppressLint("HardwareIds")
              fun getDeviceId(context: Context): String =
                  Settings.Secure.getString(context.contentResolver, Settings.Secure.ANDROID_ID) ?: "UNKNOWN_DEV"

              fun generateRequestCode(context: Context, user: String, full: String, duty: String, phone: String): String {
                  val raw = "${user.trim().lowercase(Locale.US)}|${full.trim().lowercase(Locale.US)}|${duty.trim().lowercase(Locale.US)}|${phone.trim().lowercase(Locale.US)}|${getDeviceId(context).trim().lowercase(Locale.US)}|${getSalt1()}"
                  val hex = sha256Hex(raw)
                  return "TALEP-${hex.substring(0, 4)}-${hex.substring(4, 8)}"
              }

              fun generateLicenseFromRequestCode(requestCode: String): String {
                  val hex = sha256Hex("${requestCode.trim().uppercase(Locale.US)}|${getSalt2()}")
                  return "OGM-${hex.substring(0, 4)}-${hex.substring(4, 8)}"
              }

              fun registerUser(context: Context, user: String, full: String, duty: String, phone: String, pass: String): String {
                  val s1 = getSalt1()
                  val req = generateRequestCode(context, user, full, duty, phone)
                  val licHash = sha256Hex(generateLicenseFromRequestCode(req))
                  context.getSharedPreferences(VAULT_NAME, Context.MODE_PRIVATE).edit()
                      .putString("u_name", xorEncryptBase64(user.trim(), s1))
                      .putString("u_full", xorEncryptBase64(full.trim(), s1))
                      .putString("u_duty", xorEncryptBase64(duty.trim(), s1))
                      .putString("u_phone", xorEncryptBase64(phone.trim(), s1))
                      .putString("u_pass", sha256Hex(pass + s1))
                      .putString("u_expected_lic", licHash)
                      .putBoolean("u_activated", false).apply()
                  return req
              }

              fun verifyAndActivateLicense(context: Context, inputLicense: String): Boolean {
                  val prefs = context.getSharedPreferences(VAULT_NAME, Context.MODE_PRIVATE)
                  val expected = prefs.getString("u_expected_lic", null) ?: return false
                  if (sha256Hex(inputLicense.trim().uppercase(Locale.US)) == expected) {
                      prefs.edit().putBoolean("u_activated", true).apply()
                      return true
                  }
                  return false
              }

              fun validateLogin(context: Context, inputUser: String, inputPass: String): Pair<Boolean, String> {
                  val prefs = context.getSharedPreferences(VAULT_NAME, Context.MODE_PRIVATE)
                  val encUser = prefs.getString("u_name", null) ?: return false to "Kayıtlı kullanıcı bulunamadı."
                  val savedPass = prefs.getString("u_pass", null) ?: return false to "Kasa verisi eksik."
                  val s1 = getSalt1()
                  if (!xorDecryptBase64(encUser, s1).equals(inputUser.trim(), ignoreCase = true)) return false to "Kullanıcı adı hatalı."
                  if (sha256Hex(inputPass + s1) != savedPass) return false to "Şifre hatalı."
                  if (!prefs.getBoolean("u_activated", false)) return false to "Hesabınız lisanslanmamış."
                  return true to "Giriş başarılı."
              }

              fun verifyAdminPassword(input: String): Boolean = sha256Hex(input + getSalt1()) == ADMIN_PASS_HASH

              fun activateAdminDeviceDirectly(context: Context) {
                  val s1 = getSalt1()
                  context.getSharedPreferences(VAULT_NAME, Context.MODE_PRIVATE).edit()
                      .putString("u_name", xorEncryptBase64("admin", s1))
                      .putString("u_full", xorEncryptBase64("Cihan Türkmen", s1))
                      .putString("u_duty", xorEncryptBase64("Yönetici", s1))
                      .putString("u_phone", xorEncryptBase64("-", s1))
                      .putString("u_pass", ADMIN_PASS_HASH)
                      .putBoolean("u_activated", true).apply()
              }

              fun isActivated(context: Context): Boolean =
                  context.getSharedPreferences(VAULT_NAME, Context.MODE_PRIVATE).getBoolean("u_activated", false)
          }
