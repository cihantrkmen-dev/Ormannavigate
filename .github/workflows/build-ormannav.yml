              fun startNetworkMonitoring() {
                  cm.registerNetworkCallback(NetworkRequest.Builder().addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET).build(), netCb)
              }

              fun stopNetworkMonitoring() { try { cm.unregisterNetworkCallback(netCb) } catch (_: Exception) {} }

              fun loadLocalHazards(): MutableList<RoadHazard> = if (localFile.exists()) {
                  try { json.decodeFromString<List<RoadHazard>>(localFile.readText()).toMutableList() } catch (_: Exception) { mutableListOf() }
              } else mutableListOf()

              fun reportHazard(lat: Double, lon: Double, type: HazardType, note: String) {
                  val list = loadLocalHazards()
                  list.add(RoadHazard(UUID.randomUUID().toString(), lat, lon, type, note, settings.regionCode, settings.userName, settings.isAuthorized, System.currentTimeMillis(), false))
                  localFile.writeText(json.encodeToString(list))
                  onHazardsUpdated(list)
                  CoroutineScope(Dispatchers.IO).launch { syncNow() }
              }

              suspend fun syncNow() {
                  val endpoint = settings.syncEndpointUrl
                  if (endpoint.isBlank()) return
                  val list = loadLocalHazards()
                  var changed = false
                  for (i in list.indices) {
                      if (!list[i].synced && postHazard(endpoint, list[i])) {
                          list[i] = list[i].copy(synced = true); changed = true
                      }
                  }
                  val existingIds = list.map { it.id }.toSet()
                  for (remote in fetchRegionHazards(endpoint, settings.regionCode)) {
                      if (remote.id !in existingIds) {
                          list.add(remote.copy(synced = true)); changed = true
                          showAlert(remote)
                      }
                  }
                  if (changed) { localFile.writeText(json.encodeToString(list)); onHazardsUpdated(list) }
              }

              private fun postHazard(baseUrl: String, h: RoadHazard): Boolean = try {
                  val c = (URL("$baseUrl/hazards").openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"; doOutput = true; connectTimeout = 6000; readTimeout = 6000
                      setRequestProperty("Content-Type", "application/json")
                  }
                  c.outputStream.use { it.write(json.encodeToString(h).toByteArray()) }
                  c.responseCode in 200..299
              } catch (_: Exception) { false }

              private fun fetchRegionHazards(baseUrl: String, region: String): List<RoadHazard> = try {
                  val c = (URL("$baseUrl/hazards?region=$region").openConnection() as HttpURLConnection).apply {
                      connectTimeout = 6000; readTimeout = 6000
                  }
                  if (c.responseCode == 200) json.decodeFromString(c.inputStream.bufferedReader().use { it.readText() }) else emptyList()
              } catch (_: Exception) { emptyList() }

              private fun showAlert(h: RoadHazard) {
                  val prefix = if (h.isAuthorityReport) "[YETKİLİ] " else ""
                  val n = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle("$prefix${h.regionCode}: ${h.type.label}")
                      .setContentText("${h.note} (${h.reportedBy})")
                      .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).build()
                  (context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(h.id.hashCode(), n)
              }
          }
