          package com.ormannav.app.pro

          import android.content.Context
          import android.graphics.Color
          import com.ormannav.app.model.GeoPoint
          import com.ormannav.app.model.NavigationGraph
          import org.osmdroid.util.GeoPoint as OsmGeoPoint
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Polyline
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.*

          data class TrackExportResult(val kmlFile: File, val points: List<GeoPoint>)

          object NewRoadDetector {
              fun isNewRoadArea(trackPoints: List<GeoPoint>, graph: NavigationGraph): Boolean {
                  if (trackPoints.size < 2) return false
                  if (graph.nodes.isEmpty()) return true
                  var offCount = 0
                  for (pt in trackPoints) {
                      val minDist = graph.nodes.values.minOfOrNull { n -> haversine(pt.lat, pt.lon, n.lat, n.lon) } ?: Double.POSITIVE_INFINITY
                      if (minDist > 25.0) offCount++
                  }
                  return (offCount.toDouble() / trackPoints.size) >= 0.5
              }

              private fun haversine(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371000.0; val dLat = Math.toRadians(lat2 - lat1); val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2)
                  return 2 * r * asin(sqrt(a))
              }
          }

          class TrackRecorder(private val context: Context, private val mapView: MapView) {
              var isRecording: Boolean = false
                  private set
              private val recordedPoints = mutableListOf<GeoPoint>()
              private var trackOverlay: Polyline? = null

              fun startRecording() {
                  recordedPoints.clear()
                  trackOverlay?.let { mapView.overlays.remove(it) }
                  trackOverlay = Polyline(mapView).apply {
                      outlinePaint.color = Color.parseColor("#00E676")
                      outlinePaint.strokeWidth = 8f
                  }
                  mapView.overlays.add(trackOverlay)
                  isRecording = true
              }

              fun addPoint(point: GeoPoint) {
                  if (!isRecording) return
                  recordedPoints.add(point)
                  trackOverlay?.addPoint(OsmGeoPoint(point.lat, point.lon))
                  mapView.invalidate()
              }

              fun stopAndExportKml(): TrackExportResult? {
                  isRecording = false
                  if (recordedPoints.size < 2) return null
                  val ts = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())
                  val dir = context.getExternalFilesDir("recorded_tracks") ?: context.filesDir
                  if (!dir.exists()) dir.mkdirs()
                  val file = File(dir, "OrmanIz_$ts.kml")
                  val coords = recordedPoints.joinToString(" ") { "${it.lon},${it.lat},0" }
                  file.writeText("""<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Orman Iz $ts</name><Placemark><name>Yeni Orman Yolu</name><LineString><coordinates>$coords</coordinates></LineString></Placemark></Document></kml>""")
                  return TrackExportResult(file, recordedPoints.toList())
              }
          }
