                              Toast.makeText(this, "Cihaz lisanslandı!", Toast.LENGTH_LONG).show()
                          } else Toast.makeText(this, "Geçersiz lisans kodu!", Toast.LENGTH_LONG).show()
                      }.setNegativeButton("Kapat", null).show()
              }

              private fun openMain() { startActivity(Intent(this, MainActivity::class.java)); finish() }
          }
