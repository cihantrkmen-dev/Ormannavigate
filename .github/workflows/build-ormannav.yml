          cat << 'EOF' > app/src/main/java/com/ormannav/app/MainActivity.kt
          package com.ormannav.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.location.Location
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import com.ormannav.app.graph.GraphBuilder
          import com.ormannav.app.graph.RoadUpdateManager
          import com.ormannav.app.hazard.*
          import com.ormannav.app.io.RawRoadSegment
          import com.ormannav.app.map.*
          import com.ormannav.app.model.GeoPoint
          import com.ormannav.app.nav.LiveGpsTracker
          import com.ormannav.app.nav.VoiceNavigator
          import com.ormannav.app.pro.*
          import com.ormannav.app.routing.HybridRoutePlanner
          import com.ormannav.app.routing.RouteCalculator
          import com.ormannav.app.security.AdminPanelHelper
          import com.ormannav.app.security.SecurityManager
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import org.osmdroid.config.Configuration
          import org.osmdroid.util.GeoPoint as OsmGeoPoint
          import org.osmdroid.views.MapView

          class MainActivity : AppCompatActivity() {

              private lateinit var mapView: MapView
              private lateinit var hudText: TextView
              private lateinit var crosshairView: TextView
              private lateinit var graphBuilder: GraphBuilder
              private lateinit var roadUpdateManager: RoadUpdateManager
              private lateinit var offlineMapManager: OfflineMapManager
              private lateinit var onlineMapManager: OnlineMapLayerManager
              private lateinit var orientationManager: MapOrientationManager
              private lateinit var routeOverlayManager: RouteOverlayManager
              private lateinit var hybridPlanner: HybridRoutePlanner
              private lateinit var gpsTracker: LiveGpsTracker
              private lateinit var voiceNavigator: VoiceNavigator
              private lateinit var regionSettings: RegionSettingsManager
              private lateinit var hazardSyncManager: HazardSyncManager
              private lateinit var hazardOverlayManager: HazardOverlayManager
              private lateinit var trackRecorder: TrackRecorder
              private lateinit var fieldUiManager: FieldUiManager

              private var lastLocation: Location? = null
              private var lastRemainingMeters: Double? = null
              private var settingsAdminClicks = 0

              private val roadFilesPicker = registerForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (uris.isNotEmpty()) {
                      val (graph, count) = roadUpdateManager.addOrUpdateRoads(uris)
                      roadUpdateManager.renderRoadNetworkOnMap(mapView, graph)
                      Toast.makeText(this, "$count yol segmenti navigasyon ağına eklendi.", Toast.LENGTH_LONG).show()
                  }
              }

              private val offlineMapPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  uri?.let {
                      var name = "offline.mbtiles"
                      contentResolver.query(it, null, null, null, null)?.use { c ->
                          val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (c.moveToFirst() && idx >= 0) name = c.getString(idx)
                      }
                      offlineMapManager.loadOfflineMap(mapView, it, name)
                      Toast.makeText(this, "Çevrimdışı harita yüklendi: $name", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (!SecurityManager.isActivated(this)) {
                      startActivity(Intent(this, AuthActivity::class.java))
                      finish()
                      return
                  }

                  Configuration.getInstance().userAgentValue = packageName
                  fieldUiManager = FieldUiManager(this)
                  fieldUiManager.applyScreenSettings(this)

                  val root = FrameLayout(this)
                  mapView = MapView(this).apply {
                      setMultiTouchControls(true)
                      controller.setZoom(14.0)
                      controller.setCenter(OsmGeoPoint(37.4239, 29.3496))
                  }
                  root.addView(mapView)

                  crosshairView = TextView(this).apply {
                      text = "+"; textSize = 26f; setTextColor(Color.RED); gravity = Gravity.CENTER
                      visibility = if (fieldUiManager.showCrosshair) View.VISIBLE else View.GONE
                  }
                  root.addView(crosshairView, FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.CENTER))

                  hudText = TextView(this).apply {
                      text = "GPS Sinyali Bekleniyor..."
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#B0000000"))
                      setPadding(24, 16, 24, 16)
                  }
                  root.addView(hudText, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.TOP))

                  val bottomScroll = HorizontalScrollView(this).apply { setBackgroundColor(Color.parseColor("#CC1B5E20")) }
                  val btnRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(8, 8, 8, 8) }
                  bottomScroll.addView(btnRow)
                  root.addView(bottomScroll, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM))

                  setContentView(root)

                  graphBuilder = GraphBuilder(this)
                  roadUpdateManager = RoadUpdateManager(this, graphBuilder)
                  offlineMapManager = OfflineMapManager(this)
                  onlineMapManager = OnlineMapLayerManager(mapView)
                  orientationManager = MapOrientationManager(this, mapView)
                  hybridPlanner = HybridRoutePlanner(this, RouteCalculator())
                  voiceNavigator = VoiceNavigator(this)
                  regionSettings = RegionSettingsManager(this)
                  hazardOverlayManager = HazardOverlayManager(mapView)
                  hazardSyncManager = HazardSyncManager(this, regionSettings) { list ->
                      runOnUiThread { hazardOverlayManager.renderHazards(list) }
                  }
                  trackRecorder = TrackRecorder(this, mapView)

                  routeOverlayManager = RouteOverlayManager(mapView) { target ->
                      val start = lastLocation?.let { GeoPoint(it.latitude, it.longitude) }
                          ?: GeoPoint(mapView.mapCenter.latitude, mapView.mapCenter.longitude)
                      CoroutineScope(Dispatchers.Main).launch {
                          val res = hybridPlanner.planRoute(graphBuilder.loadExistingGraph(), start, target)
                          if (res != null) {
                              routeOverlayManager.drawRoute(res)
                              lastRemainingMeters = res.totalDistanceMeters
                              voiceNavigator.startNavigation(res.pathPoints)
                              Toast.makeText(this@MainActivity, "Rota hazır: %.2f km".format(res.totalDistanceMeters / 1000.0), Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this@MainActivity, "Rota hesaplanamadı.", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.apply { attachTapListener() }

                  btnRow.addView(makeBtn("Yol Ekle (KML/SHP)") { roadFilesPicker.launch(arrayOf("*/*")) })
                  btnRow.addView(makeBtn("Harita Katmanı") { showMapLayerDialog() })
                  val btnCompass = makeBtn("Yön: Gidiş") { }
                  btnCompass.setOnClickListener {
                      val m = orientationManager.cycleMode()
                      btnCompass.text = "Yön: ${m.label}"
                  }
                  btnRow.addView(btnCompass)

                  val btnTrack = makeBtn("İz Kaydet") { }
                  btnTrack.setOnClickListener {
                      if (!trackRecorder.isRecording) {
                          trackRecorder.startRecording()
                          btnTrack.text = "İzi Durdur"
                      } else {
                          btnTrack.text = "İz Kaydet"
                          trackRecorder.stopAndExportKml()?.let { handleStoppedTrack(it) }
                      }
                  }
                  btnRow.addView(btnTrack)
                  btnRow.addView(makeBtn("Yol Uyarısı") { showHazardReportDialog() })
                  btnRow.addView(makeBtn("Ayarlar") { showSettingsDialog() })

                  onlineMapManager.switchLayer(OnlineMapLayer.GOOGLE_HYBRID)
                  roadUpdateManager.renderRoadNetworkOnMap(mapView, graphBuilder.loadExistingGraph())
                  hazardOverlayManager.renderHazards(hazardSyncManager.loadLocalHazards())
                  fieldUiManager.applyMapNightFilter(mapView)

                  gpsTracker = LiveGpsTracker(this) { loc ->
                      lastLocation = loc
                      val pt = GeoPoint(loc.latitude, loc.longitude)
                      orientationManager.onGpsUpdate(loc.bearing, loc.speed)
                      voiceNavigator.updatePosition(pt)
                      if (trackRecorder.isRecording) trackRecorder.addPoint(pt)
                      hudText.text = fieldUiManager.formatTelemetryHud(loc, lastRemainingMeters)
                  }

                  requestPermissionsIfNeeded()
              }

              private fun makeBtn(title: String, action: () -> Unit) = Button(this).apply {
                  text = title; setOnClickListener { action() }
              }

              private fun showMapLayerDialog() {
                  val items = arrayOf("Google Hibrit (Online)", "Google Yol (Online)", "OpenStreetMap (Online)", "OpenTopoMap (Online)", "Çevrimdışı Harita Aç (.gpkg / .mbtiles / .sqlitedb)")
                  AlertDialog.Builder(this).setTitle("Harita Altlığı Seç").setItems(items) { _, w ->
                      when (w) {
                          0 -> onlineMapManager.switchLayer(OnlineMapLayer.GOOGLE_HYBRID)
                          1 -> onlineMapManager.switchLayer(OnlineMapLayer.GOOGLE_ROADS)
                          2 -> onlineMapManager.switchLayer(OnlineMapLayer.OSM_STANDARD)
                          3 -> onlineMapManager.switchLayer(OnlineMapLayer.OPEN_TOPO)
                          4 -> offlineMapPicker.launch(arrayOf("*/*"))
                      }
                  }.show()
              }

              private fun showHazardReportDialog() {
                  val pos = lastLocation?.let { GeoPoint(it.latitude, it.longitude) }
                      ?: GeoPoint(mapView.mapCenter.latitude, mapView.mapCenter.longitude)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 24, 40, 16) }
                  val rg = RadioGroup(this)
                  val rbClosed = RadioButton(this).apply { text = HazardType.CLOSED.label; isChecked = true }
                  val rbDamaged = RadioButton(this).apply { text = HazardType.DAMAGED.label }
                  rg.addView(rbClosed); rg.addView(rbDamaged)
                  val etNote = EditText(this).apply { hint = "Açıklama (örn: Heyelan / Köprü yıkık)" }
                  l.addView(rg); l.addView(etNote)

                  AlertDialog.Builder(this).setTitle("Kapalı / Hasarlı Yol Bildir").setView(l)
                      .setPositiveButton("Kaydet ve Bildir") { _, _ ->
                          val type = if (rbClosed.isChecked) HazardType.CLOSED else HazardType.DAMAGED
                          hazardSyncManager.reportHazard(pos.lat, pos.lon, type, etNote.text.toString().ifBlank { type.label })
                          Toast.makeText(this, "Uyarı kaydedildi. Online olunca yöreye iletilecek.", Toast.LENGTH_SHORT).show()
                      }.setNegativeButton("İptal", null).show()
              }

              private fun showSettingsDialog() {
                  settingsAdminClicks = 0
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 24, 40, 16) }
                  val etRegion = EditText(this).apply { hint = "Yöre / Şeflik Kodu"; setText(regionSettings.regionCode) }
                  val etName = EditText(this).apply { hint = "Kullanıcı Adınız"; setText(regionSettings.userName) }
                  val etUrl = EditText(this).apply { hint = "Senkronizasyon Sunucu URL (Opsiyonel)"; setText(regionSettings.syncEndpointUrl) }
                  val cbAuth = CheckBox(this).apply { text = "Yöre Yetkilisi Olarak İşaretle"; isChecked = regionSettings.isAuthorized }
                  val cbScreen = CheckBox(this).apply { text = "Ekranı Sürekli Açık Tut"; isChecked = fieldUiManager.keepScreenOn }
                  val cbNight = CheckBox(this).apply { text = "Gece Sürüş Harita Filtresi"; isChecked = fieldUiManager.nightModeMap }
                  val cbCross = CheckBox(this).apply { text = "Merkez Nişangahı (+) Göster"; isChecked = fieldUiManager.showCrosshair }
                  val tvVer = TextView(this).apply {
                      text = "OrmanNav v1.0 | Geliştirici: Cihan Türkmen"
                      gravity = Gravity.CENTER; setPadding(0, 32, 0, 8)
                      setOnClickListener {
                          if (++settingsAdminClicks >= 5) {
                              settingsAdminClicks = 0
                              AdminPanelHelper.openWithPasswordCheck(this@MainActivity, false)
                          }
                      }
                  }
                  listOf(etRegion, etName, etUrl, cbAuth, cbScreen, cbNight, cbCross, tvVer).forEach { l.addView(it) }

                  AlertDialog.Builder(this).setTitle("Ayarlar").setView(l)
                      .setPositiveButton("Kaydet") { _, _ ->
                          regionSettings.regionCode = etRegion.text.toString()
                          regionSettings.userName = etName.text.toString()
                          regionSettings.syncEndpointUrl = etUrl.text.toString()
                          regionSettings.isAuthorized = cbAuth.isChecked
                          fieldUiManager.keepScreenOn = cbScreen.isChecked
                          fieldUiManager.nightModeMap = cbNight.isChecked
                          fieldUiManager.showCrosshair = cbCross.isChecked
                          fieldUiManager.applyScreenSettings(this)
                          fieldUiManager.applyMapNightFilter(mapView)
                          crosshairView.visibility = if (fieldUiManager.showCrosshair) View.VISIBLE else View.GONE
                      }.setNegativeButton("Kapat", null).show()
              }

              private fun handleStoppedTrack(result: TrackExportResult) {
                  val currentGraph = graphBuilder.loadExistingGraph()
                  if (NewRoadDetector.isNewRoadArea(result.points, currentGraph)) {
                      val input = EditText(this).apply { setText("İz Yolu - ${result.kmlFile.nameWithoutExtension}") }
                      AlertDialog.Builder(this)
                          .setTitle("Yeni Yol Tespit Edildi")
                          .setMessage("Bu güzergahta mevcut yol ağı yok. Kaydedilen KML izini navigasyon ağına eklemek ister misiniz?")
                          .setView(input)
                          .setPositiveButton("Evet, Ağa Ekle") { _, _ ->
                              val g = graphBuilder.appendSegmentsToGraph(listOf(RawRoadSegment(input.text.toString().ifBlank { "Yeni Yol" }, result.points)))
                              roadUpdateManager.renderRoadNetworkOnMap(mapView, g)
                              Toast.makeText(this, "Yeni yol navigasyon ağına eklendi.", Toast.LENGTH_LONG).show()
                          }
                          .setNegativeButton("Hayır, Sadece KML Sakla", null).show()
                  } else {
                      Toast.makeText(this, "İz KML kaydedildi: ${result.kmlFile.name}", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun requestPermissionsIfNeeded() {
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter { ActivityCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) ActivityCompat.requestPermissions(this, missing.toTypedArray(), 101)
                  else gpsTracker.startTracking()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      gpsTracker.startTracking()
                  }
              }

              override fun onResume() { super.onResume(); mapView.onResume(); orientationManager.start(); hazardSyncManager.startNetworkMonitoring() }
              override fun onPause() { super.onPause(); mapView.onPause(); orientationManager.stop(); hazardSyncManager.stopNetworkMonitoring() }
              override fun onDestroy() { super.onDestroy(); gpsTracker.stopTracking(); voiceNavigator.shutdown() }
          }
