          cat << 'EOF' > app/src/main/java/com/ormannav/app/routing/RouteCalculator.kt
          package com.ormannav.app.routing

          import com.ormannav.app.model.GeoPoint
          import com.ormannav.app.model.GraphNode
          import com.ormannav.app.model.NavigationGraph
          import java.util.PriorityQueue
          import kotlin.math.*

          data class RouteResult(
              val pathPoints: List<GeoPoint>,
              val totalDistanceMeters: Double,
              val offRoadStartMeters: Double,
              val offRoadEndMeters: Double
          )

          class RouteCalculator {
              fun calculateShortestPath(graph: NavigationGraph, startPoint: GeoPoint, targetPoint: GeoPoint): RouteResult? {
                  if (graph.nodes.isEmpty()) return null
                  val (startNode, startSnapDist) = findNearestNode(graph, startPoint) ?: return null
                  val (endNode, endSnapDist) = findNearestNode(graph, targetPoint) ?: return null

                  val gScore = mutableMapOf<Int, Double>().withDefault { Double.POSITIVE_INFINITY }
                  val fScore = mutableMapOf<Int, Double>().withDefault { Double.POSITIVE_INFINITY }
                  val cameFrom = mutableMapOf<Int, Int>()

                  gScore[startNode.id] = 0.0
                  fScore[startNode.id] = haversineMeters(startNode.lat, startNode.lon, endNode.lat, endNode.lon)

                  val openSet = PriorityQueue<Pair<Int, Double>>(compareBy { it.second })
                  openSet.add(startNode.id to fScore.getValue(startNode.id))
                  val closedSet = mutableSetOf<Int>()

                  while (openSet.isNotEmpty()) {
                      val (currentId, _) = openSet.poll() ?: break
                      if (currentId == endNode.id) {
                          val path = mutableListOf<GeoPoint>()
                          var curr: Int? = currentId
                          while (curr != null) {
                              graph.nodes[curr]?.let { path.add(GeoPoint(it.lat, it.lon)) }
                              curr = cameFrom[curr]
                          }
                          path.reverse()
                          return RouteResult(path, gScore.getValue(currentId), startSnapDist, endSnapDist)
                      }
                      if (!closedSet.add(currentId)) continue
                      for (edge in graph.adjacencyList[currentId] ?: continue) {
                          if (edge.toNodeId in closedSet) continue
                          val tentativeG = gScore.getValue(currentId) + edge.distanceMeters
                          if (tentativeG < gScore.getValue(edge.toNodeId)) {
                              cameFrom[edge.toNodeId] = currentId
                              gScore[edge.toNodeId] = tentativeG
                              val neighbor = graph.nodes[edge.toNodeId] ?: continue
                              val f = tentativeG + haversineMeters(neighbor.lat, neighbor.lon, endNode.lat, endNode.lon)
                              fScore[edge.toNodeId] = f
                              openSet.add(edge.toNodeId to f)
                          }
                      }
                  }
                  return null
              }

              private fun findNearestNode(graph: NavigationGraph, target: GeoPoint): Pair<GraphNode, Double>? {
                  var nearest: GraphNode? = null
                  var minDist = Double.POSITIVE_INFINITY
                  for (node in graph.nodes.values) {
                      val d = haversineMeters(node.lat, node.lon, target.lat, target.lon)
                      if (d < minDist) { minDist = d; nearest = node }
                  }
                  return nearest?.let { it to minDist }
              }

              private fun haversineMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371000.0
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2)
                  return 2 * r * asin(sqrt(a))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/routing/HybridRoutePlanner.kt
          package com.ormannav.app.routing

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import com.ormannav.app.model.GeoPoint
          import com.ormannav.app.model.GraphNode
          import com.ormannav.app.model.NavigationGraph
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.ArrayDeque
          import kotlin.math.*

          class HybridRoutePlanner(
              private val context: Context,
              private val localCalculator: RouteCalculator
          ) {
              private val graphThresholdMeters = 150.0

              suspend fun planRoute(graph: NavigationGraph, start: GeoPoint, target: GeoPoint): RouteResult? =
                  withContext(Dispatchers.IO) {
                      if (!isInternetAvailable()) {
                          return@withContext localCalculator.calculateShortestPath(graph, start, target)
                      }
                      if (graph.nodes.isEmpty()) return@withContext fetchOsrmRoute(start, target)

                      val startNearest = findNearestNode(graph, start)
                      val targetNearest = findNearestNode(graph, target)
                      val startInForest = startNearest != null && startNearest.second <= graphThresholdMeters
                      val targetInForest = targetNearest != null && targetNearest.second <= graphThresholdMeters

                      when {
                          startInForest && targetInForest -> {
                              localCalculator.calculateShortestPath(graph, start, target) ?: run {
                                  val exitNode = findBestBridgeNode(graph, startNearest!!.first.id, target)
                                  val entryNode = findBestBridgeNode(graph, targetNearest!!.first.id, start)
                                  val l1 = localCalculator.calculateShortestPath(graph, start, GeoPoint(exitNode.lat, exitNode.lon))
                                  val l2 = fetchOsrmRoute(GeoPoint(exitNode.lat, exitNode.lon), GeoPoint(entryNode.lat, entryNode.lon))
                                  val l3 = localCalculator.calculateShortestPath(graph, GeoPoint(entryNode.lat, entryNode.lon), target)
                                  if (l1 != null && l2 != null && l3 != null) combineRoutes(combineRoutes(l1, l2), l3)
                                  else fetchOsrmRoute(start, target)
                              }
                          }
                          !startInForest && targetInForest -> {
                              val entryNode = findBestBridgeNode(graph, targetNearest!!.first.id, start)
                              val entryPt = GeoPoint(entryNode.lat, entryNode.lon)
                              val onlineLeg = fetchOsrmRoute(start, entryPt)
                              val forestLeg = localCalculator.calculateShortestPath(graph, entryPt, target)
                              if (onlineLeg != null && forestLeg != null) combineRoutes(onlineLeg, forestLeg)
                              else fetchOsrmRoute(start, target) ?: forestLeg
                          }
                          startInForest && !targetInForest -> {
                              val exitNode = findBestBridgeNode(graph, startNearest!!.first.id, target)
                              val exitPt = GeoPoint(exitNode.lat, exitNode.lon)
                              val forestLeg = localCalculator.calculateShortestPath(graph, start, exitPt)
                              val onlineLeg = fetchOsrmRoute(exitPt, target)
                              if (forestLeg != null && onlineLeg != null) combineRoutes(forestLeg, onlineLeg)
                              else fetchOsrmRoute(start, target) ?: forestLeg
                          }
                          else -> fetchOsrmRoute(start, target)
                      }
                  }

              private fun findBestBridgeNode(graph: NavigationGraph, seedId: Int, ref: GeoPoint): GraphNode {
                  val visited = mutableSetOf(seedId)
                  val queue = ArrayDeque<Int>().apply { add(seedId) }
                  var best = graph.nodes[seedId]!!
                  var minDist = haversineMeters(best.lat, best.lon, ref.lat, ref.lon)
                  while (queue.isNotEmpty()) {
                      val cid = queue.poll() ?: break
                      val n = graph.nodes[cid] ?: continue
                      val d = haversineMeters(n.lat, n.lon, ref.lat, ref.lon)
                      if (d < minDist) { minDist = d; best = n }
                      graph.adjacencyList[cid]?.forEach { if (visited.add(it.toNodeId)) queue.add(it.toNodeId) }
                  }
                  return best
              }

              private fun combineRoutes(first: RouteResult, second: RouteResult): RouteResult {
                  val pts = mutableListOf<GeoPoint>().apply {
                      addAll(first.pathPoints)
                      if (second.pathPoints.isNotEmpty()) addAll(second.pathPoints.drop(1))
                  }
                  return RouteResult(pts, first.totalDistanceMeters + second.totalDistanceMeters, first.offRoadStartMeters, second.offRoadEndMeters)
              }

              private fun fetchOsrmRoute(from: GeoPoint, to: GeoPoint): RouteResult? {
                  val urlStr = "https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson"
                  return try {
                      val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                          connectTimeout = 8000; readTimeout = 8000; setRequestProperty("User-Agent", "OrmanNav/1.0")
                      }
                      if (conn.responseCode != 200) return null
                      val json = JSONObject(conn.inputStream.bufferedReader().use { it.readText() })
                      val routes = json.getJSONArray("routes")
                      if (routes.length() == 0) return null
                      val rObj = routes.getJSONObject(0)
                      val coords = rObj.getJSONObject("geometry").getJSONArray("coordinates")
                      val pts = (0 until coords.length()).map { i ->
                          val c = coords.getJSONArray(i); GeoPoint(c.getDouble(1), c.getDouble(0))
                      }
                      if (pts.size < 2) null else RouteResult(pts, rObj.getDouble("distance"), 0.0, 0.0)
                  } catch (_: Exception) { null }
              }

              private fun isInternetAvailable(): Boolean {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val caps = cm.getNetworkCapabilities(cm.activeNetwork ?: return false) ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }

              private fun findNearestNode(graph: NavigationGraph, target: GeoPoint): Pair<GraphNode, Double>? {
                  var nearest: GraphNode? = null; var minDist = Double.POSITIVE_INFINITY
                  for (node in graph.nodes.values) {
                      val d = haversineMeters(node.lat, node.lon, target.lat, target.lon)
                      if (d < minDist) { minDist = d; nearest = node }
                  }
                  return nearest?.let { it to minDist }
              }

              private fun haversineMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371000.0
                  val dLat = Math.toRadians(lat2 - lat1); val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2)
                  return 2 * r * asin(sqrt(a))
              }
          }
