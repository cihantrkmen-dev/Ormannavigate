          package com.ormannav.app.map

          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.compass.CompassOverlay
          import org.osmdroid.views.overlay.compass.InternalCompassOrientationProvider

          enum class MapOrientationMode(val label: String) {
              COURSE_UP("Gidiş Yönü"),
              COMPASS_UP("Pusula Yönü"),
              NORTH_UP("Kuzey Sabit")
          }

          class MapOrientationManager(context: Context, private val mapView: MapView) : SensorEventListener {
              private val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private val rotationSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
              var mode: MapOrientationMode = MapOrientationMode.COURSE_UP
                  private set
              private var currentCompassAzimuth = 0f
              private var lastAppliedAngle = 0f
              private var isMovingFast = false

              init {
                  val compassOverlay = CompassOverlay(context, InternalCompassOrientationProvider(context), mapView).apply {
                      enableCompass()
                  }
                  mapView.overlays.add(compassOverlay)
              }

              fun start() { rotationSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) } }
              fun stop() { sensorManager.unregisterListener(this) }

              fun cycleMode(): MapOrientationMode {
                  mode = when (mode) {
                      MapOrientationMode.COURSE_UP -> MapOrientationMode.COMPASS_UP
                      MapOrientationMode.COMPASS_UP -> MapOrientationMode.NORTH_UP
                      MapOrientationMode.NORTH_UP -> MapOrientationMode.COURSE_UP
                  }
                  if (mode == MapOrientationMode.NORTH_UP) applyMapAngle(0f)
                  return mode
              }

              fun onGpsUpdate(bearing: Float, speedMetersPerSec: Float) {
                  isMovingFast = speedMetersPerSec > 1.0f
                  if (mode == MapOrientationMode.COURSE_UP && isMovingFast && bearing != 0f) applyMapAngle(-bearing)
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (event.sensor.type != Sensor.TYPE_ROTATION_VECTOR) return
                  val rot = FloatArray(9); val ori = FloatArray(3)
                  SensorManager.getRotationMatrixFromVector(rot, event.values)
                  SensorManager.getOrientation(rot, ori)
                  val raw = (Math.toDegrees(ori[0].toDouble()).toFloat() + 360f) % 360f
                  currentCompassAzimuth = smoothAngle(currentCompassAzimuth, raw, 0.15f)
                  if (mode == MapOrientationMode.COMPASS_UP || (mode == MapOrientationMode.COURSE_UP && !isMovingFast)) {
                      applyMapAngle(-currentCompassAzimuth)
                  }
              }

              private fun applyMapAngle(angle: Float) {
                  if (kotlin.math.abs(angle - lastAppliedAngle) > 1.5f || angle == 0f) {
                      mapView.mapOrientation = angle
                      lastAppliedAngle = angle
                  }
              }

              private fun smoothAngle(cur: Float, tgt: Float, alpha: Float): Float {
                  var d = tgt - cur
                  while (d < -180f) d += 360f
                  while (d > 180f) d -= 360f
                  return (cur + alpha * d + 360f) % 360f
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
