          cat << 'EOF' > app/src/main/java/com/ormannav/app/nav/VoiceNavigator.kt
          package com.ormannav.app.nav

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import com.ormannav.app.model.GeoPoint
          import java.util.Locale
          import kotlin.math.*

          class VoiceNavigator(context: Context) : TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = TextToSpeech(context, this)
              private var isReady = false
              private var activeRoute: List<GeoPoint> = emptyList()
              private var currentIdx = 0
              private var lastAnnouncedIdx = -1
              private var lastOffRouteTime = 0L

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) { tts?.language = Locale("tr", "TR"); isReady = true }
              }

              fun startNavigation(route: List<GeoPoint>) {
                  activeRoute = route; currentIdx = 0; lastAnnouncedIdx = -1
                  speak("Navigasyon başlatıldı. Rotayı takip edin.")
              }

              fun updatePosition(pos: GeoPoint) {
                  if (activeRoute.size < 2 || currentIdx >= activeRoute.size) return
                  if (haversine(pos, activeRoute.last()) < 20.0) {
                      speak("Hedefe ulaştınız."); activeRoute = emptyList(); return
                  }
                  var closestDist = Double.POSITIVE_INFINITY; var closestIdx = currentIdx
                  for (i in currentIdx until minOf(currentIdx + 10, activeRoute.size)) {
                      val d = haversine(pos, activeRoute[i])
                      if (d < closestDist) { closestDist = d; closestIdx = i }
                  }
                  currentIdx = closestIdx
                  if (closestDist > 35.0) {
                      val now = System.currentTimeMillis()
                      if (now - lastOffRouteTime > 15000L) {
                          speak("Rotadan çıktınız. Orman yoluna geri dönün.")
                          lastOffRouteTime = now
                      }
                      return
                  }
                  val nextIdx = currentIdx + 1
                  if (nextIdx + 1 < activeRoute.size && nextIdx != lastAnnouncedIdx && haversine(pos, activeRoute[nextIdx]) <= 50.0) {
                      val b1 = bearing(activeRoute[currentIdx], activeRoute[nextIdx])
                      val b2 = bearing(activeRoute[nextIdx], activeRoute[nextIdx + 1])
                      var turn = (b2 - b1) % 360.0
                      if (turn > 180.0) turn -= 360.0; if (turn < -180.0) turn += 360.0
                      val msg = when {
                          turn in 35.0..120.0 -> "50 metre sonra sağa dönün."
                          turn > 120.0 -> "50 metre sonra keskin sağa dönün."
                          turn in -120.0..-35.0 -> "50 metre sonra sola dönün."
                          turn < -120.0 -> "50 metre sonra keskin sola dönün."
                          else -> null
                      }
                      if (msg != null) { speak(msg); lastAnnouncedIdx = nextIdx }
                  }
              }

              fun speak(text: String) { if (isReady) tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "nav") }
              fun shutdown() { tts?.stop(); tts?.shutdown() }

              private fun bearing(p1: GeoPoint, p2: GeoPoint): Double {
                  val lat1 = Math.toRadians(p1.lat); val lat2 = Math.toRadians(p2.lat)
                  val dLon = Math.toRadians(p2.lon - p1.lon)
                  return (Math.toDegrees(atan2(sin(dLon) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) * cos(lat2) * cos(dLon))) + 360.0) % 360.0
              }

              private fun haversine(p1: GeoPoint, p2: GeoPoint): Double {
                  val r = 6371000.0; val dLat = Math.toRadians(p2.lat - p1.lat); val dLon = Math.toRadians(p2.lon - p1.lon)
                  val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(p1.lat)) * cos(Math.toRadians(p2.lat)) * sin(dLon / 2).pow(2)
                  return 2 * r * asin(sqrt(a))
              }
          }
