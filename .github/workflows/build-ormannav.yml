          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID

          class HazardSyncManager(
              private val context: Context,
              private val settings: RegionSettingsManager,
              private val onHazardsUpdated: (List<RoadHazard>) -> Unit
          ) {
              private val json = Json { ignoreUnknownKeys = true }
              private val localFile get() = File(context.filesDir, "road_hazards.json")
              private val channelId = "orman_road_alerts"
              private val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager

              private val netCb = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) {
                      CoroutineScope(Dispatchers.IO).launch { syncNow() }
                  }
              }

              init {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(channelId, "Yöre Yol Uyarıları", NotificationManager.IMPORTANCE_HIGH)
                      (context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
