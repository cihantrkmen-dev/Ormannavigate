          cat << 'EOF' > app/src/main/java/com/ormannav/app/io/BulkFileImporter.kt
          package com.ormannav.app.io

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import com.ormannav.app.model.GeoPoint

          data class RawRoadSegment(val name: String, val points: List<GeoPoint>)

          class BulkFileImporter(private val context: Context) {
              fun importFiles(uris: List<Uri>): List<RawRoadSegment> {
                  val allSegments = mutableListOf<RawRoadSegment>()
                  for (uri in uris) {
                      val fileName = getFileName(uri).lowercase()
                      context.contentResolver.openInputStream(uri)?.use { stream ->
                          when {
                              fileName.endsWith(".kml") -> allSegments.addAll(KmlRoadParser.parse(stream))
                              fileName.endsWith(".shp") -> allSegments.addAll(ShpRoadParser.parse(stream, fileName))
                              else -> Unit
                          }
                      }
                  }
                  return allSegments
              }

              private fun getFileName(uri: Uri): String {
                  var name = "unknown"
                  context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (cursor.moveToFirst() && index >= 0) name = cursor.getString(index)
                  }
                  return name
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/io/RoadParsers.kt
          package com.ormannav.app.io

          import android.util.Xml
          import com.ormannav.app.model.GeoPoint
          import org.xmlpull.v1.XmlPullParser
          import java.io.InputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object KmlRoadParser {
              fun parse(inputStream: InputStream): List<RawRoadSegment> {
                  val segments = mutableListOf<RawRoadSegment>()
                  val parser = Xml.newPullParser()
                  parser.setInput(inputStream, "UTF-8")

                  var eventType = parser.eventType
                  var currentName = "Orman Yolu"
                  var inLineString = false

                  while (eventType != XmlPullParser.END_DOCUMENT) {
                      when (eventType) {
                          XmlPullParser.START_TAG -> {
                              when (parser.name.lowercase()) {
                                  "name" -> currentName = parser.nextText().trim()
                                  "linestring" -> inLineString = true
                                  "coordinates" -> if (inLineString) {
                                      val coordsText = parser.nextText().trim()
                                      val points = coordsText.split(Regex("\\s+")).mapNotNull { token ->
                                          val parts = token.split(",")
                                          if (parts.size >= 2) {
                                              val lon = parts[0].toDoubleOrNull()
                                              val lat = parts[1].toDoubleOrNull()
                                              if (lat != null && lon != null) GeoPoint(lat, lon) else null
                                          } else null
                                      }
                                      if (points.size >= 2) segments.add(RawRoadSegment(currentName, points))
                                  }
                              }
                          }
                          XmlPullParser.END_TAG -> {
                              if (parser.name.lowercase() == "linestring") inLineString = false
                          }
                      }
                      eventType = parser.next()
                  }
                  return segments
              }
          }

          object ShpRoadParser {
              fun parse(inputStream: InputStream, defaultName: String): List<RawRoadSegment> {
                  val bytes = inputStream.readBytes()
                  if (bytes.size < 100) return emptyList()

                  val segments = mutableListOf<RawRoadSegment>()
                  val buffer = ByteBuffer.wrap(bytes)
                  var offset = 100

                  while (offset + 8 <= bytes.size) {
                      buffer.order(ByteOrder.BIG_ENDIAN)
                      val contentLengthWords = buffer.getInt(offset + 4)
                      val recordStart = offset + 8
                      val contentLengthBytes = contentLengthWords * 2
                      if (recordStart + contentLengthBytes > bytes.size) break

                      buffer.order(ByteOrder.LITTLE_ENDIAN)
                      val shapeType = buffer.getInt(recordStart)

                      if (shapeType == 3 || shapeType == 13 || shapeType == 23) {
                          val numParts = buffer.getInt(recordStart + 36)
                          val numPoints = buffer.getInt(recordStart + 40)
                          val partsStart = recordStart + 44
                          val pointsStart = partsStart + (numParts * 4)
                          val partIndices = IntArray(numParts) { i -> buffer.getInt(partsStart + i * 4) }

                          for (p in 0 until numParts) {
                              val startIdx = partIndices[p]
                              val endIdx = if (p + 1 < numParts) partIndices[p + 1] else numPoints
                              val pts = mutableListOf<GeoPoint>()
                              for (i in startIdx until endIdx) {
                                  val ptOffset = pointsStart + (i * 16)
                                  val lon = buffer.getDouble(ptOffset)
                                  val lat = buffer.getDouble(ptOffset + 8)
                                  pts.add(GeoPoint(lat, lon))
                              }
                              if (pts.size >= 2) segments.add(RawRoadSegment(defaultName, pts))
                          }
                      }
                      offset = recordStart + contentLengthBytes
                  }
                  return segments
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/graph/GraphBuilder.kt
          package com.ormannav.app.graph

          import android.content.Context
          import com.ormannav.app.io.RawRoadSegment
          import com.ormannav.app.model.*
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import java.io.File
          import kotlin.math.*

          class GraphBuilder(private val context: Context) {
              private val snapToleranceMeters = 8.0
              private val graphFile get() = File(context.filesDir, "forest_nav_graph.json")

              fun loadExistingGraph(): NavigationGraph {
                  return if (graphFile.exists()) {
                      try { Json.decodeFromString(graphFile.readText()) } catch (_: Exception) { NavigationGraph() }
                  } else NavigationGraph()
              }

              fun appendSegmentsToGraph(segments: List<RawRoadSegment>): NavigationGraph {
                  val graph = loadExistingGraph()
                  var nextNodeId = (graph.nodes.keys.maxOrNull() ?: 0) + 1

                  fun findOrCreateNode(pt: GeoPoint): Int {
                      for ((id, node) in graph.nodes) {
                          if (haversineMeters(node.lat, node.lon, pt.lat, pt.lon) <= snapToleranceMeters) {
                              return id
                          }
                      }
                      val newId = nextNodeId++
                      graph.nodes[newId] = GraphNode(newId, pt.lat, pt.lon)
                      return newId
                  }

                  for (segment in segments) {
                      for (i in 0 until segment.points.size - 1) {
                          val n1 = findOrCreateNode(segment.points[i])
                          val n2 = findOrCreateNode(segment.points[i + 1])
                          if (n1 == n2) continue

                          val dist = haversineMeters(
                              segment.points[i].lat, segment.points[i].lon,
                              segment.points[i + 1].lat, segment.points[i + 1].lon
                          )
                          graph.adjacencyList.getOrPut(n1) { mutableListOf() }.add(GraphEdge(n1, n2, dist, segment.name))
                          graph.adjacencyList.getOrPut(n2) { mutableListOf() }.add(GraphEdge(n2, n1, dist, segment.name))
                      }
                  }
                  graphFile.writeText(Json.encodeToString(graph))
                  return graph
              }

              private fun haversineMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val r = 6371000.0
                  val dLat = Math.toRadians(lat2 - lat1)
                  val dLon = Math.toRadians(lon2 - lon1)
                  val a = sin(dLat / 2).pow(2) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2).pow(2)
                  return 2 * r * asin(sqrt(a))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/graph/RoadUpdateManager.kt
          package com.ormannav.app.graph

          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import com.ormannav.app.io.BulkFileImporter
          import com.ormannav.app.model.NavigationGraph
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import org.osmdroid.util.GeoPoint as OsmGeoPoint
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Polyline
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          @Serializable
          data class RoadUpdateLog(val fileCount: Int, val addedSegments: Int, val timestamp: String)

          class RoadUpdateManager(
              private val context: Context,
              private val graphBuilder: GraphBuilder
          ) {
              private val importer = BulkFileImporter(context)
              private val logFile get() = File(context.filesDir, "road_updates_log.json")
              private val roadOverlays = mutableListOf<Polyline>()

              fun addOrUpdateRoads(uris: List<Uri>): Pair<NavigationGraph, Int> {
                  val rawSegments = importer.importFiles(uris)
                  val updatedGraph = graphBuilder.appendSegmentsToGraph(rawSegments)
                  for ((nodeId, edges) in updatedGraph.adjacencyList) {
                      updatedGraph.adjacencyList[nodeId] = edges.distinctBy { it.toNodeId }.toMutableList()
                  }
                  saveUpdateLog(uris.size, rawSegments.size)
                  return updatedGraph to rawSegments.size
              }

              fun renderRoadNetworkOnMap(mapView: MapView, graph: NavigationGraph) {
                  roadOverlays.forEach { mapView.overlays.remove(it) }
                  roadOverlays.clear()
                  val drawnPairs = mutableSetOf<Pair<Int, Int>>()

                  for ((fromId, edges) in graph.adjacencyList) {
                      val fromNode = graph.nodes[fromId] ?: continue
                      for (edge in edges) {
                          val pair = minOf(fromId, edge.toNodeId) to maxOf(fromId, edge.toNodeId)
                          if (!drawnPairs.add(pair)) continue
                          val toNode = graph.nodes[edge.toNodeId] ?: continue
                          val line = Polyline(mapView).apply {
                              setPoints(listOf(OsmGeoPoint(fromNode.lat, fromNode.lon), OsmGeoPoint(toNode.lat, toNode.lon)))
                              outlinePaint.color = Color.parseColor("#2196F3")
                              outlinePaint.strokeWidth = 4f
                          }
                          roadOverlays.add(line)
                          mapView.overlays.add(line)
                      }
                  }
                  mapView.invalidate()
              }

              private fun saveUpdateLog(fileCount: Int, addedSegments: Int) {
                  val history = if (logFile.exists()) {
                      try { Json.decodeFromString<List<RoadUpdateLog>>(logFile.readText()).toMutableList() }
                      catch (_: Exception) { mutableListOf() }
                  } else mutableListOf()
                  val now = SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(Date())
                  history.add(RoadUpdateLog(fileCount, addedSegments, now))
                  logFile.writeText(Json.encodeToString(history))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/map/OfflineTileArchive.kt
          package com.ormannav.app.map

          import android.database.sqlite.SQLiteDatabase
          import org.osmdroid.tileprovider.modules.IArchiveFile
          import org.osmdroid.tileprovider.tilesource.ITileSource
          import org.osmdroid.util.MapTileIndex
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.InputStream

          enum class OfflineMapFormat { MBTILES, GEOPACKAGE, SQLITEDB, UNKNOWN }

          class OfflineTileArchive : IArchiveFile {
              private var db: SQLiteDatabase? = null
              private var format: OfflineMapFormat = OfflineMapFormat.UNKNOWN
              private var gpkgTileTable: String? = null
              private var isInvertedZoomSqlitedb: Boolean = true

              override fun init(pFile: File) {
                  db = SQLiteDatabase.openDatabase(
                      pFile.absolutePath, null,
                      SQLiteDatabase.OPEN_READONLY or SQLiteDatabase.NO_LOCALIZED_COLLATORS
                  )
                  format = when (pFile.extension.lowercase()) {
                      "mbtiles" -> OfflineMapFormat.MBTILES
                      "gpkg" -> OfflineMapFormat.GEOPACKAGE
                      "sqlitedb", "db" -> OfflineMapFormat.SQLITEDB
                      else -> OfflineMapFormat.UNKNOWN
                  }
                  if (format == OfflineMapFormat.GEOPACKAGE) {
                      val c = db?.rawQuery("SELECT table_name FROM gpkg_contents WHERE data_type = 'tiles' LIMIT 1", null)
                      gpkgTileTable = c?.use { if (it.moveToFirst()) it.getString(0) else null }
                  } else if (format == OfflineMapFormat.SQLITEDB) {
                      val c = db?.rawQuery("SELECT MIN(z) FROM tiles", null)
                      isInvertedZoomSqlitedb = c?.use { if (it.moveToFirst()) it.getInt(0) <= 5 else true } ?: true
                  }
              }

              override fun getInputStream(pTileSource: ITileSource?, pMapTileIndex: Long): InputStream? {
                  val database = db ?: return null
                  val z = MapTileIndex.getZoom(pMapTileIndex)
                  val x = MapTileIndex.getX(pMapTileIndex)
                  val y = MapTileIndex.getY(pMapTileIndex)

                  val (query, args) = when (format) {
                      OfflineMapFormat.MBTILES -> {
                          val tmsY = (1 shl z) - 1 - y
                          "SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?" to
                              arrayOf(z.toString(), x.toString(), tmsY.toString())
                      }
                      OfflineMapFormat.GEOPACKAGE -> {
                          val table = gpkgTileTable ?: return null
                          "SELECT tile_data FROM \"$table\" WHERE zoom_level=? AND tile_column=? AND tile_row=?" to
                              arrayOf(z.toString(), x.toString(), y.toString())
                      }
                      OfflineMapFormat.SQLITEDB -> {
                          val dbZ = if (isInvertedZoomSqlitedb) 17 - z else z
                          "SELECT image FROM tiles WHERE z=? AND x=? AND y=?" to
                              arrayOf(dbZ.toString(), x.toString(), y.toString())
                      }
                      OfflineMapFormat.UNKNOWN -> return null
                  }
                  return try {
                      database.rawQuery(query, args).use { c ->
                          if (c.moveToFirst()) c.getBlob(0)?.let { ByteArrayInputStream(it) } else null
                      }
                  } catch (_: Exception) { null }
              }

              override fun getTileSources(): Set<String> = setOf("OfflineForestMap")
              override fun close() { db?.close(); db = null }
              override fun setIgnoreTileSource(pIgnoreTileSource: Boolean) {}
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/map/OfflineMapManager.kt
          package com.ormannav.app.map

          import android.content.Context
          import android.net.Uri
          import org.osmdroid.tileprovider.MapTileProviderArray
          import org.osmdroid.tileprovider.modules.MapTileFileArchiveProvider
          import org.osmdroid.tileprovider.tilesource.XYTileSource
          import org.osmdroid.tileprovider.util.SimpleRegisterReceiver
          import org.osmdroid.views.MapView
          import java.io.File
          import java.io.FileOutputStream

          class OfflineMapManager(private val context: Context) {
              fun loadOfflineMap(mapView: MapView, fileUri: Uri, fileName: String) {
                  val dir = context.getExternalFilesDir("offline_maps") ?: context.filesDir
                  if (!dir.exists()) dir.mkdirs()
                  val targetFile = File(dir, fileName)
                  if (!targetFile.exists()) {
                      context.contentResolver.openInputStream(fileUri)?.use { input ->
                          FileOutputStream(targetFile).use { output -> input.copyTo(output) }
                      }
                  }
                  val archive = OfflineTileArchive().apply { init(targetFile) }
                  val tileSource = XYTileSource("OfflineForestMap", 1, 20, 256, ".png", arrayOf(""))
                  val archiveProvider = MapTileFileArchiveProvider(SimpleRegisterReceiver(context), tileSource, arrayOf(archive))
                  val tileProvider = MapTileProviderArray(tileSource, SimpleRegisterReceiver(context), arrayOf(archiveProvider))
                  mapView.apply {
                      setUseDataConnection(false)
                      setTileProvider(tileProvider)
                      invalidate()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ormannav/app/map/OnlineMapLayerManager.kt
          package com.ormannav.app.map

          import org.osmdroid.tileprovider.tilesource.OnlineTileSourceBase
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.MapTileIndex
          import org.osmdroid.views.MapView

          enum class OnlineMapLayer(val displayName: String) {
              GOOGLE_HYBRID("Google Hibrit (Uydu + Yol)"),
              GOOGLE_ROADS("Google Yol Haritası"),
              OSM_STANDARD("OpenStreetMap"),
              OPEN_TOPO("OpenTopoMap (Arazi)")
          }

          class OnlineMapLayerManager(private val mapView: MapView) {
              private val googleHybridSource = object : OnlineTileSourceBase(
                  "Google-Hybrid", 0, 20, 256, ".png",
                  arrayOf("https://mt0.google.com/vt/lyrs=y&hl=tr&x=", "https://mt1.google.com/vt/lyrs=y&hl=tr&x=")
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl + MapTileIndex.getX(pMapTileIndex) + "&y=" + MapTileIndex.getY(pMapTileIndex) + "&z=" + MapTileIndex.getZoom(pMapTileIndex)
              }

              private val googleRoadsSource = object : OnlineTileSourceBase(
                  "Google-Roads", 0, 20, 256, ".png",
                  arrayOf("https://mt0.google.com/vt/lyrs=m&hl=tr&x=", "https://mt1.google.com/vt/lyrs=m&hl=tr&x=")
              ) {
                  override fun getTileURLString(pMapTileIndex: Long): String =
                      baseUrl + MapTileIndex.getX(pMapTileIndex) + "&y=" + MapTileIndex.getY(pMapTileIndex) + "&z=" + MapTileIndex.getZoom(pMapTileIndex)
              }

              private val openTopoSource = object : OnlineTileSourceBase(
                  "OpenTopoMap", 0, 17, 256, ".png",
                  arrayOf("https://a.tile.opentopomap.org/", "https://b.tile.opentopomap.org/")
              ) {
